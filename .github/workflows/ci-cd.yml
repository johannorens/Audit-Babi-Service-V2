name: CI/CD Babi Services

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ─────────────────────────────────────────────
  # 1. Tests backend (PHPUnit)
  # ─────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: babiservice_test
          MYSQL_USER: babiuser
          MYSQL_PASSWORD: babipass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u babiuser -pbabipass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, zip
          coverage: xdebug

      - name: Installer les dépendances Composer
        working-directory: babi
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Créer le .env de test
        working-directory: babi
        run: |
          cat <<EOF > .env
          APP_NAME=BabiServices
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=babiservice_test
          DB_USERNAME=babiuser
          DB_PASSWORD=babipass
          EOF

      - name: Générer la clé Laravel
        working-directory: babi
        run: php artisan key:generate

      - name: Migration base de données
        working-directory: babi
        run: php artisan migrate --force

      - name: Tests PHPUnit avec couverture
        working-directory: babi
        run: php artisan test --coverage --min=60


  # ─────────────────────────────────────────────
  # 2. Build & lint frontend React
  # ─────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/mon-app-react/package-lock.json

      - name: Installer dépendances
        working-directory: front/mon-app-react
        run: npm ci

      - name: Lint React
        working-directory: front/mon-app-react
        run: npm run lint

      - name: Build production
        working-directory: front/mon-app-react
        run: npm run build


  # ─────────────────────────────────────────────
  # 3. Tests de charge k6
  # ─────────────────────────────────────────────
  load-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer le .env Docker
        run: |
          cat <<EOF > babi/.env
          APP_NAME=BabiServices
          APP_ENV=local
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost:8000

          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=babiservice
          DB_USERNAME=babiuser
          DB_PASSWORD=babipass
          EOF

      - name: Démarrer Docker
        run: docker compose up -d --build

      - name: Attendre le backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/services > /dev/null; then
              echo "Backend prêt"
              break
            fi
            echo "Attente backend ($i/30)"
            sleep 5
          done

      - name: Préparer Laravel
        run: |
          docker compose exec -T back php artisan key:generate
          docker compose exec -T back php artisan migrate --force
          docker compose exec -T back php artisan db:seed --class=AdminSeeder --force

      - name: Installer k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
          --keyserver hkp://keyserver.ubuntu.com:80 \
          --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69

          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
          | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Lancer k6
        run: k6 run --env BASE_URL=http://localhost:8000 k6/load-test.js

      - name: Stop Docker
        if: always()
        run: docker compose down -v


  # ─────────────────────────────────────────────
  # 4. PR automatique develop → main
  # ─────────────────────────────────────────────
  open-pr-to-main:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Créer PR develop vers main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh pr create \
          --base main \
          --head develop \
          --title "Sync develop → main" \
          --body "PR automatique après validation CI."
          || echo "PR déjà existante"


  # ─────────────────────────────────────────────
  # 5. Déploiement Railway après merge main
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest

    needs: [backend-tests, frontend-build]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Railway CLI
        run: npm install -g @railway/cli

      - name: Déployer sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

        run: railway up --service "-babi-services" --detach